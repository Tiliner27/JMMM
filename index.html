<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portada: Biología Celular</title>
    <style>
        /* --- CONFIGURACIÓN GENERAL Y VARIABLES --- */
        :root {
            --bg-color: #0a0f1d;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --accent-neon: #00ff87;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- EFECTOS DE FONDO BIOLÓGICOS --- */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.15;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: var(--primary-neon);
            top: -10%;
            left: -10%;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: var(--accent-neon);
            bottom: -10%;
            right: -10%;
        }

        /* --- CONTENEDOR PRINCIPAL (LA PORTADA) --- */
        .cover-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 950px;
            background: rgba(10, 15, 29, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Envoltura decorativa para simular una célula */
        .cell-glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 24px;
            border: 1px solid transparent;
            background: linear-gradient(135deg, var(--primary-neon), var(--accent-neon)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            opacity: 0.3;
            pointer-events: none;
        }

        /* --- CATEGORÍA / MEMBRETE --- */
        .institution {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent-neon);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        /* --- TÍTULO PRINCIPAL --- */
        .title {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 30%, var(--primary-neon) 70%, var(--accent-neon) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 3rem auto;
            font-weight: 400;
            line-height: 1.6;
        }

        /* --- SECCIÓN DE TEMAS (TARJETAS) --- */
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .topic-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .topic-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-neon);
            background: rgba(0, 242, 254, 0.02);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.1);
        }

        .topic-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary-neon);
        }

        .topic-card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .topic-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .boton {
            width: 100%;
            padding: 1rem 1.25rem;
            background: linear-gradient(135deg, var(--primary-neon), var(--accent-neon));
            color: var(--bg-color);
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
            text-align: center;
        }

        .boton:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 30px rgba(0, 242, 254, 0.18);
            opacity: 0.95;
        }

        /* --- PIE DE PORTADA (DATOS DEL ALUMNO) --- */
        .footer-info {
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .info-block {
            text-align: left;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* --- RESPONSIVIDAD --- */
        @media (max-width: 768px) {
            .title { font-size: 2.8rem; }
            .cover-container { padding: 2rem 1.5rem; }
            .footer-info { flex-direction: column; text-align: center; gap: 1rem; }
            .info-block { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="cover-container">
        <div class="cell-glow"></div>


        <h1 class="title">BIOLOGÍA<br>CELULAR</h1>
        <p class="subtitle">La unidad fundamental de la vida: estructura, funciones, metabolismo y la complejidad.</p>

        <div class="topics-grid">
            <div class="topic-card">
                <button class="boton" onclick="window.location.href='Selector.html'">
                    Ir a Selector
                </button>
            </div>
        </div>

        <div class="footer-info">
            <div class="info-block">
                <p class="info-label">Autor</p>
                <p class="info-value">Equipo N:1</p>
            </div>
            <div class="info-block">
                <p class="info-label">Asignatura</p>
                <p class="info-value">Organismos_Biología</p>
            </div>
            <div class="info-block">
                <p class="info-label">Profesor</p>
                <p class="info-value">Elvira Garcia Ibarra</p>
            </div>
            <div class="info-block">
                <p class="info-label">Fecha</p>
                <p class="info-value">Mayo, 2026</p>
            </div>
        </div>
    </div>

</body>
</html>
